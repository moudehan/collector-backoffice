name: CI-CD Frontend

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality_and_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

  tests:
    runs-on: ubuntu-latest
    needs: quality_and_build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Start frontend (E2E)
        run: |
          VITE_E2E=true npm run dev -- --host 0.0.0.0 --port 5173 --strictPort > vite.log 2>&1 &
          echo $! > vite.pid
          sleep 2
          ps -p $(cat vite.pid) || (echo "Vite not running"; cat vite.log; exit 1)
          cat vite.log

      - name: Wait for app
        run: npx wait-on -t 60000 http-get://127.0.0.1:5173/

      - name: Run Cypress E2E
        run: npm run test:e2e

      - name: Upload vite logs (failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vite-log
          path: vite.log

  security:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit deps (SCA)
        run: npm audit --audit-level=high || true

      - name: Run tests with coverage for Sonar
        run: npm run test:cov

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  build:
    runs-on: ubuntu-latest
    needs: security
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Upload dist artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  docker_image:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image (local tag for kind)
        run: |
          docker build -t collector-frontend:ci .

      - name: Save image (artifact)
        run: |
          docker save collector-frontend:ci -o collector-frontend-ci.tar

      - name: Upload docker image tar
        uses: actions/upload-artifact@v4
        with:
          name: collector-frontend-image
          path: collector-frontend-ci.tar

  deploy_staging_kind:
    runs-on: ubuntu-latest
    needs: docker_image
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: staging

      - name: Download docker image tar
        uses: actions/download-artifact@v4
        with:
          name: collector-frontend-image

      - name: Load image into Docker
        run: |
          docker load -i collector-frontend-ci.tar
          docker images | head -n 20

      - name: Load image into kind
        run: |
          kind load docker-image collector-frontend:ci --name staging

      - name: Deploy frontend to Kubernetes (staging)
        run: |
          set -e
          kubectl apply -f k8s/frontend-staging.yaml
          kubectl -n staging rollout status deploy/frontend --timeout=180s
          kubectl -n staging get pods,svc -o wide

      - name: Smoke test (healthz)
        run: |
          set -e
          kubectl -n staging run curltest --rm -i --restart=Never \
            --image=curlimages/curl:8.5.0 \
            --command -- sh -lc '
              for i in $(seq 1 20); do
                code=$(curl -s -o /dev/null -w "%{http_code}" http://frontend/healthz || true)
                echo "try $i => HTTP $code"
                [ "$code" = "200" ] && exit 0
                sleep 2
              done
              echo "Frontend not healthy"
              exit 1
            '
